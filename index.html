<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TruyenForFun — Manga / Manhwa Reader</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg" />
    <script>
      // Apply the saved theme before first paint (no dark flash in light mode).
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (err) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking: offline use must not wait on the font request. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Permanent+Marker&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <header class="header glass-panel">
        <div class="header-left">
          <div class="logo">
            <img src="logo.jpg" alt="" class="logo-img" />
            <h1>TruyenForFun</h1>
          </div>
        </div>

        <div class="header-controls">
          <div class="tab-group" role="group" aria-label="Reading mode">
            <button id="mangaTab" class="tab-btn" type="button" aria-pressed="false">
              Manga
            </button>
            <button id="manhwaTab" class="tab-btn active" type="button" aria-pressed="true">
              Manhwa
            </button>
          </div>

          <div class="control-separator"></div>

          <div class="control-group">
            <div
              id="manhwaWidthControl"
              class="mode-size-control size-stepper"
              role="group"
              aria-label="Manhwa image width"
            >
              <button
                id="decreaseManhwaWidth"
                class="size-stepper-btn"
                type="button"
                aria-label="Decrease Manhwa image width"
              >
                −
              </button>
              <output id="manhwaWidthValue" aria-live="polite">30%</output>
              <button
                id="increaseManhwaWidth"
                class="size-stepper-btn"
                type="button"
                aria-label="Increase Manhwa image width"
              >
                +
              </button>
            </div>

            <div id="mangaSizeControl" class="mode-size-control" hidden>
              <select
                id="thumbSize"
                class="select-input"
                title="Thumbnail size"
                aria-label="Thumbnail size"
              >
                <option value="small">Small</option>
                <option value="medium" selected>Medium</option>
                <option value="large">Large</option>
              </select>
            </div>
          </div>

          <div class="control-group">
            <button id="openFolderBtn" class="action-btn primary" type="button">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"
                />
              </svg>
              Open Folder
            </button>
            <input id="chooseFolder" type="file" webkitdirectory directory multiple hidden />
            <button
              id="clearBtn"
              class="action-btn danger"
              type="button"
              title="Clear all"
              aria-label="Clear all"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 6h18" />
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                <path d="M10 11v6M14 11v6" />
              </svg>
            </button>
          </div>

          <div class="control-separator"></div>

          <button
            id="themeToggleBtn"
            class="action-btn"
            type="button"
            title="Toggle theme"
            aria-label="Toggle theme"
          >
            <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
              />
            </svg>
            <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
            </svg>
          </button>
        </div>
      </header>

      <div class="workspace">
        <button
          id="sidebarTrigger"
          class="sidebar-trigger"
          type="button"
          title="Open explorer"
          aria-label="Open explorer"
          aria-controls="sidebar"
          aria-expanded="false"
        >
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M13 17l5-5-5-5" />
            <path d="M6 17l5-5-5-5" />
          </svg>
        </button>

        <aside id="sidebar" class="sidebar glass-panel" aria-label="Explorer">
          <div class="sidebar-header">
            <h2>Explorer</h2>
            <div class="sidebar-actions">
              <button
                id="sidebarReload"
                class="sidebar-action-btn"
                type="button"
                title="Reload folder"
                aria-label="Reload folder"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                  <path d="M3 3v5h5" />
                </svg>
              </button>
              <button
                id="sidebarSort"
                class="sidebar-action-btn sort-btn"
                type="button"
                aria-label="Toggle sort mode"
              >
                A–Z
              </button>
              <button
                id="sidebarPin"
                class="sidebar-pin-btn"
                type="button"
                title="Pin sidebar"
                aria-label="Pin sidebar"
                aria-pressed="false"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 17v5" />
                  <path
                    d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"
                  />
                </svg>
              </button>
            </div>
          </div>
          <div class="sidebar-content custom-scrollbar">
            <!-- Folder tree renders here -->
          </div>
          <div class="sidebar-resizer" id="sidebarResizer" aria-hidden="true"></div>
        </aside>

        <div class="main-body-container" id="mainBody">
          <main class="main-content">
            <div class="empty-state" id="emptyState">
              <div class="drop-zone" id="dropZone">
                <div class="drop-zone-content">
                  <svg class="empty-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"
                    />
                  </svg>
                  <h2>Drop Folder Here</h2>
                  <p>Drag and drop a folder to view your images</p>
                  <div class="drop-zone-divider">
                    <span>or</span>
                  </div>
                  <button class="drop-zone-btn" id="browseFolderBtn" type="button">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                      <path
                        d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"
                      />
                    </svg>
                    <span>Browse Folder</span>
                  </button>
                </div>
              </div>
            </div>
            <section id="gallery" class="manhwa-list" aria-label="Images"></section>
          </main>

          <footer class="footer glass-panel">
            <div class="footer-content">
              <p>
                &copy; <span id="copyrightYear">2025</span>
                <strong>TruyenForFun</strong>. All rights reserved.
              </p>
            </div>
          </footer>
        </div>
      </div>
    </div>

    <!-- Scroll buttons -->
    <div class="scroll-buttons">
      <button id="scrollTopBtn" class="scroll-btn" type="button" title="Scroll to top" aria-label="Scroll to top">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 15l-6-6-6 6" />
        </svg>
      </button>
      <button
        id="scrollBottomBtn"
        class="scroll-btn"
        type="button"
        title="Scroll to bottom"
        aria-label="Scroll to bottom"
      >
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 9l6 6 6-6" />
        </svg>
      </button>
    </div>

    <!-- Viewer for Manga -->
    <dialog id="modal" class="modal" aria-label="Image viewer">
      <div class="image-wrapper" id="imageWrapper">
        <img id="modalImage" class="modal-image" alt="" draggable="false" />
      </div>

      <button class="nav-btn prev-btn" id="prevBtn" type="button" aria-label="Previous image">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>
      <button class="nav-btn next-btn" id="nextBtn" type="button" aria-label="Next image">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 18l6-6-6-6" />
        </svg>
      </button>

      <div class="zoom-controls glass-panel">
        <button id="zoomInBtn" class="zoom-btn" type="button" aria-label="Zoom in" title="Zoom in (+)">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
        <button id="zoomOutBtn" class="zoom-btn" type="button" aria-label="Zoom out" title="Zoom out (-)">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14" />
          </svg>
        </button>
        <button
          id="resetZoomBtn"
          class="zoom-btn"
          type="button"
          aria-label="Reset zoom"
          title="Reset to fit (0 / R)"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>
      </div>

      <!-- Live zoom percentage; click to fit -->
      <button id="zoomIndicator" class="zoom-indicator" type="button" title="Reset to fit">100%</button>

      <button id="closeModalBtn" class="close-modal-btn" type="button" aria-label="Close viewer">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </dialog>

    <!-- Shown while dragging files anywhere over the window -->
    <div class="drop-overlay" aria-hidden="true">
      <div class="drop-overlay-content">
        <svg class="drop-icon" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <path d="m7 10 5 5 5-5M12 15V3" />
        </svg>
        <p>Drop folder to open</p>
      </div>
    </div>

    <div id="contextMenu" class="context-menu" role="menu" hidden>
      <button class="context-item" id="ctxOpen" type="button" role="menuitem">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"
          />
        </svg>
        <span>Open Folder</span>
      </button>
      <button class="context-item" id="ctxSetRoot" type="button" role="menuitem">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <path d="M9 22V12h6v10" />
        </svg>
        <span>Set as Root</span>
      </button>
    </div>

    <script src="explorer-tree.js"></script>
    <script src="image-size-controls.js"></script>
    <script src="modal-zoom.js"></script>
    <script src="script.js"></script>
  </body>
</html>
